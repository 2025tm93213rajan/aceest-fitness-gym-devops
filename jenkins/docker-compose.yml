services:
  jenkins:
    build: .
    container_name: aceest-jenkins
    user: root
    ports:
      # Port 8081 on host to avoid conflict with pre-installed Jenkins running on 8080 in Prayogshala
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  jenkins_home:
