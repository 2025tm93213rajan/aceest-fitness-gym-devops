[flake8]
max-line-length = 100
exclude = .venv,venv,legacy,__pycache__,Assignment 2,Introduction to DevOps Assignment - 1 2026

[coverage:run]
branch = True
source = aceest

[coverage:report]
show_missing = True

[tool:pytest]
testpaths = tests
addopts = --cov=aceest --cov-report=term-missing --cov-report=xml:reports/coverage.xml --junitxml=reports/junit.xml
