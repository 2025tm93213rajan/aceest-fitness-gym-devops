name: CI

# push builds only for the default branch; feature branches get checked through
# their pull request instead, so a branch + its PR don't run the pipeline twice
on:
  push:
    branches: master
  pull_request:

permissions:
  contents: read

jobs:
  # 1. Build & lint - catch syntax / style problems before spending time on docker
  lint:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile all sources (syntax check)
        run: python -m compileall -q app.py aceest tests

      - name: flake8
        run: flake8 .

  # 2. Docker image assembly - build the runtime image and make sure it actually boots
  docker-build:
    name: Docker Image Assembly
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          load: true
          tags: aceest-fitness:ci
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name aceest -p 5000:5000 aceest-fitness:ci
          # give gunicorn a few seconds to come up
          for i in $(seq 1 15); do
            if curl -fs http://localhost:5000/health; then
              echo
              exit 0
            fi
            sleep 1
          done
          echo "container did not become healthy"
          docker logs aceest
          exit 1

  # 3. Automated testing - run pytest inside the container, not on the runner
  test:
    name: Automated Tests (in Docker)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          load: true
          tags: aceest-fitness:test
          cache-from: type=gha,scope=test
          cache-to: type=gha,scope=test,mode=max

      - name: Run pytest inside the container
        run: docker run --rm aceest-fitness:test
