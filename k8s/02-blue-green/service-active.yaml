apiVersion: v1
kind: Service
metadata:
  name: aceest-production-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    environment: production
spec:
  type: NodePort
  selector:
    app: aceest-app
    role: blue # Active production target: switch to 'green' for cutover
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30081
