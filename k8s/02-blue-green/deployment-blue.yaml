apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-blue
  namespace: aceest-fitness
  labels:
    app: aceest-app
    role: blue
    version: v1.0.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aceest-app
      role: blue
  template:
    metadata:
      labels:
        app: aceest-app
        role: blue
        version: v1.0.0
    spec:
      containers:
        - name: aceest-app
          image: 2025tm93213rajan/aceest-fitness:v1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_RELEASE
              value: "v1-blue"
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
