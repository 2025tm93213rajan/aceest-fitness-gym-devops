apiVersion: v1
kind: Service
metadata:
  name: aceest-preview-service
  namespace: aceest-fitness
  labels:
    app: aceest-app
    environment: preview
spec:
  type: NodePort
  selector:
    app: aceest-app
    role: green # Always routes to the staging/preview version
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30082
