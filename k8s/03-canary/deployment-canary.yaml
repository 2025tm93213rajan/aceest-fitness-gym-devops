apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-canary
  namespace: aceest-fitness
  labels:
    app: aceest-canary-app
    track: canary
    version: v2.0.0
spec:
  replicas: 1 # 25% traffic canary
  selector:
    matchLabels:
      app: aceest-canary-app
      track: canary
  template:
    metadata:
      labels:
        app: aceest-canary-app
        track: canary
        version: v2.0.0
    spec:
      containers:
        - name: aceest-app
          image: 2025tm93213rajan/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_RELEASE
              value: "v2-canary"
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
