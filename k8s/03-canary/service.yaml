apiVersion: v1
kind: Service
metadata:
  name: aceest-canary-service
  namespace: aceest-fitness
  labels:
    app: aceest-canary-app
    strategy: canary
spec:
  type: NodePort
  selector:
    app: aceest-canary-app # Selects both 'stable' (3 pods) and 'canary' (1 pod)
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30083
