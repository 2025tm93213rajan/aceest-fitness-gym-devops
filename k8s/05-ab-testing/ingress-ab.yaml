apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress-primary
  namespace: aceest-fitness
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-variant-a
                port:
                  number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-ab-ingress-experiment
  namespace: aceest-fitness
  annotations:
    # Routes users providing header "X-Features: beta" to Variant B
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Features"
    nginx.ingress.kubernetes.io/canary-by-header-value: "beta"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-service-variant-b
                port:
                  number: 5000
