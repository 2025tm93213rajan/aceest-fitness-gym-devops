apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest-fitness
  labels:
    app: aceest-rolling
    strategy: rolling-update
    version: v-broken
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
        version: v-broken
    spec:
      containers:
        - name: aceest-app
          # Non-existent broken image tag triggers ImagePullBackOff / Crash
          image: 2025tm93213rajan/aceest-fitness:v-broken-invalid
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 2
