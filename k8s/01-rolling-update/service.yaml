apiVersion: v1
kind: Service
metadata:
  name: aceest-rolling-svc
  namespace: aceest-fitness
  labels:
    app: aceest-rolling
    strategy: rolling-update
spec:
  type: NodePort
  selector:
    app: aceest-rolling
  ports:
    - name: http
      port: 5000
      targetPort: 5000
      nodePort: 30080
