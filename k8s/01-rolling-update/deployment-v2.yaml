apiVersion: apps/v1
kind: Deployment
metadata:
  name: aceest-rolling
  namespace: aceest-fitness
  labels:
    app: aceest-rolling
    strategy: rolling-update
    version: v2.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: aceest-rolling
  template:
    metadata:
      labels:
        app: aceest-rolling
        version: v2.0.0
    spec:
      containers:
        - name: aceest-app
          image: 2025tm93213rajan/aceest-fitness:v2.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: APP_VERSION
              value: "2.0.0"
            - name: APP_RELEASE
              value: "v2-analytics"
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
