apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aceest-shadow-ingress
  namespace: aceest-fitness
  annotations:
    # NGINX Ingress traffic mirroring annotation duplicates incoming traffic to shadow service
    nginx.ingress.kubernetes.io/mirror-target: "http://aceest-shadow-service.aceest-fitness.svc.cluster.local:5000"
    nginx.ingress.kubernetes.io/mirror-request-body: "on"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aceest-primary-service
                port:
                  number: 5000
