# SonarQube Project Configuration for ACEest Fitness & Gym
sonar.projectKey=aceest-fitness-gym
sonar.projectName=ACEest Fitness & Gym DevOps
sonar.projectVersion=2.0.0

# Source & Test directories
sonar.sources=aceest,app.py
sonar.tests=tests

# Language and encoding
sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Test execution and coverage reports
sonar.python.coverage.reportPaths=reports/coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Quality gate and analysis wait
sonar.qualitygate.wait=false

# Excluded paths
sonar.exclusions=**/__pycache__/**,legacy/**,Assignment 2/**,Introduction to DevOps Assignment - 1 2026/**,docs/**,jenkins/**,sonarqube/**,k8s/**
